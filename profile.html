<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — AnthonyTheSabakumono</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0A; --surface: #111111; --surface2: #161616; --surface3: #1E1E1E;
  --border: #242424; --border-hi: #2E2E2E;
  --gold: #C9A84C; --gold-b: #E8C96A; --gold-dim: #7A5E28;
  --text: #F0EDE4; --text-dim: #6E6A62; --text-mid: #9A9590;
  --radius: 8px; --radius-sm: 5px;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; font-size: 15px; line-height: 1.6; min-height: 100vh; }
a { color: inherit; text-decoration: none; }

.site-header { position: sticky; top: 0; z-index: 100; height: 52px; background: rgba(10,10,10,0.96); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 32px; gap: 16px; }
.brand { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.auth-btn { display: flex; align-items: center; gap: 7px; font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bg); background: var(--gold); border: 1px solid var(--gold); border-radius: var(--radius-sm); padding: 6px 13px; cursor: pointer; }
.auth-btn:hover { background: var(--gold-b); }
.user-chip { display: none; align-items: center; gap: 9px; border: 1px solid var(--border-hi); border-radius: 20px; padding: 4px 12px 4px 4px; cursor: pointer; position: relative; }
.user-avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-hi); object-fit: cover; }
.user-name-chip { font-family: 'DM Mono', monospace; font-size: 11px; }
.user-menu { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--surface2); border: 1px solid var(--border-hi); border-radius: var(--radius-sm); min-width: 140px; overflow: hidden; }
.user-chip.open .user-menu { display: block; }
.user-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text-mid); font-family: 'DM Mono', monospace; font-size: 11px; padding: 10px 14px; cursor: pointer; }
.user-menu button:hover { background: var(--surface3); color: var(--gold); }

.wrap { max-width: 640px; margin: 0 auto; padding: 48px 32px 80px; }
.gate { background: var(--surface); border: 1px solid var(--border-hi); border-radius: var(--radius); padding: 32px; text-align: center; font-family: 'DM Mono', monospace; color: var(--text-mid); }

.profile-head { display: flex; align-items: center; gap: 18px; margin-bottom: 32px; }
.profile-avatar { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--gold-dim); object-fit: cover; }
.profile-name { font-family: 'DM Serif Display', serif; font-size: 24px; }
.profile-total { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gold); margin-top: 4px; }

.history-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; margin-bottom: 8px; }
.history-title { font-family: 'DM Mono', monospace; font-size: 13px; }
.history-points { font-family: 'DM Serif Display', serif; color: var(--gold); font-size: 17px; }
.empty-note { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-dim); text-align: center; padding: 24px 0; }
</style>
</head>
<body>

<header class="site-header">
  <span class="brand">AnthonyTheSabakumono</span>
  <div class="header-right">
    <button id="auth-btn" class="auth-btn">Sign In</button>
    <div id="user-chip" class="user-chip" onclick="this.classList.toggle('open')">
      <img id="user-avatar" class="user-avatar" src="" alt="">
      <span id="user-name" class="user-name-chip"></span>
      <div class="user-menu">
        <button onclick="event.stopPropagation(); location.href='profile.html'">My Profile</button>
        <button onclick="event.stopPropagation(); location.href='leaderboard.html'">Leaderboard</button>
        <button onclick="event.stopPropagation(); signOutUser()">Sign Out</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="content"><div class="gate">Loading…</div></div>
</div>

<script type="module">
  import { auth, db } from './firebase-setup.js';
  import {
    collection, query, where, getDocs, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const content = document.getElementById('content');

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loadProfile(user);
    } else {
      content.innerHTML = '<div class="gate">Sign in (top right) to see your profile and test history.</div>';
    }
  });

  async function loadProfile(user) {
    // Every entry this user has ever earned. This is the ONLY source of
    // truth for their total — there is no stored totalPoints field to
    // read instead, by design (see the security rules for why).
    const ledgerQuery = query(collection(db, 'pointsLedger'), where('uid', '==', user.uid));
    const ledgerSnap = await getDocs(ledgerQuery);

    const entries = ledgerSnap.docs.map(d => d.data());
    const total = entries.reduce((sum, e) => sum + (e.points || 0), 0);

    // Look up each test's title for a nicer history list. Small enough
    // scale that one getDoc per distinct test is fine.
    const titleCache = {};
    for (const e of entries) {
      if (!titleCache[e.refId]) {
        const testSnap = await getDoc(doc(db, 'tests', e.refId));
        titleCache[e.refId] = testSnap.exists() ? testSnap.data().title : e.refId;
      }
    }

    const historyHtml = entries.length
      ? entries.map(e => `
          <div class="history-item">
            <span class="history-title">${titleCache[e.refId]}</span>
            <span class="history-points">+${e.points}</span>
          </div>
        `).join('')
      : '<div class="empty-note">No tests submitted yet — take a weekly test to start earning points.</div>';

    content.innerHTML = `
      <div class="profile-head">
        <img class="profile-avatar" src="${user.photoURL || ''}" alt="">
        <div>
          <div class="profile-name">${user.displayName || user.email}</div>
          <div class="profile-total">${total} points total</div>
        </div>
      </div>
      ${historyHtml}
    `;
  }
</script>
<script type="module" src="firebase-setup.js"></script>
</body>
</html>
